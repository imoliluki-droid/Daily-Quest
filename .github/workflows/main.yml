name: Build Daily Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-build
    paths-ignore:
      - 'Daily_Quest_PhoneBuild.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -o Daily_Quest_PhoneBuild.zip -d build_project

      - name: Apply Daily Quest v2 Android layer
        run: |
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          APP="$PROJECT/app/src/main"
          mkdir -p "$APP/assets" "$APP/java/com/dailyquest/app"
          cp Daily_Quest_Web/index.html "$APP/assets/index.html"

          curl -L --fail --retry 3 -o "$APP/assets/w_speed_icon.jpg" "https://images.complex.com/complex/image/upload/c_crop,h_1760,w_2840,x_0,y_0/g_xy_center,x_1415,y_666/v1751915394/sanity-new/Screenshot_2025-07-07_at_15.09.35_cqfwnk"

          cat > "$APP/java/com/dailyquest/app/MainActivity.java" <<'JAVA'
          package com.dailyquest.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.usage.UsageStats;
          import android.app.usage.UsageStatsManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.Calendar;
          import java.util.List;

          public class MainActivity extends Activity {
              public static final String CHANNEL_ID = "daily_quest_notifications";
              private static final int NOTIFICATION_REQUEST_CODE = 1001;
              private NotificationManager notificationManager;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  notificationManager=(NotificationManager)getSystemService(NOTIFICATION_SERVICE);
                  createNotificationChannel();
                  WebView w=new WebView(this);
                  w.setWebViewClient(new WebViewClient());
                  WebSettings s=w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  w.addJavascriptInterface(new NotificationBridge(),"AndroidNotifications");
                  w.loadUrl("file:///android_asset/index.html");
                  setContentView(w);
              }

              private void createNotificationChannel(){
                  if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O){
                      NotificationChannel c=new NotificationChannel(CHANNEL_ID,"Daily Quest",NotificationManager.IMPORTANCE_DEFAULT);
                      c.setDescription("W Speed reminders, quests, achievements and phone pings");
                      notificationManager.createNotificationChannel(c);
                  }
              }
              private boolean notificationsAllowed(){return Build.VERSION.SDK_INT<33||checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)==PackageManager.PERMISSION_GRANTED;}
              private void requestNotificationPermission(){if(Build.VERSION.SDK_INT>=33&&!notificationsAllowed())requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},NOTIFICATION_REQUEST_CODE);}

              private void notifyNow(String title,String body){
                  if(!notificationsAllowed()){requestNotificationPermission();return;}
                  NotificationManager nm=notificationManager;
                  android.app.Notification.Builder b=Build.VERSION.SDK_INT>=26?new android.app.Notification.Builder(this,CHANNEL_ID):new android.app.Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(title).setContentText(body).setAutoCancel(true);
                  nm.notify((int)(System.currentTimeMillis()%100000),b.build());
              }

              private void scheduleNotification(String title,String body,long delayMs){
                  if(!notificationsAllowed()){requestNotificationPermission();return;}
                  long trigger=System.currentTimeMillis()+Math.max(1000,delayMs);
                  Intent i=new Intent(this,AlarmReceiver.class).putExtra("title",title).putExtra("body",body);
                  PendingIntent pi=PendingIntent.getBroadcast(this,(int)(trigger%100000),i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
                  AlarmManager am=(AlarmManager)getSystemService(ALARM_SERVICE);
                  if(am!=null)am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,trigger,pi);
              }

              private boolean usageAccessGranted(){
                  try{UsageStatsManager u=(UsageStatsManager)getSystemService(USAGE_STATS_SERVICE);long now=System.currentTimeMillis();List<UsageStats> x=u.queryUsageStats(UsageStatsManager.INTERVAL_DAILY,now-60000,now);return x!=null&&!x.isEmpty();}catch(Exception e){return false;}
              }

              private String usageSummary(){
                  JSONArray arr=new JSONArray();
                  try{
                      UsageStatsManager u=(UsageStatsManager)getSystemService(USAGE_STATS_SERVICE);
                      Calendar c=Calendar.getInstance();c.set(Calendar.HOUR_OF_DAY,0);c.set(Calendar.MINUTE,0);c.set(Calendar.SECOND,0);c.set(Calendar.MILLISECOND,0);
                      List<UsageStats> list=u.queryUsageStats(UsageStatsManager.INTERVAL_DAILY,c.getTimeInMillis(),System.currentTimeMillis());
                      if(list!=null)for(UsageStats x:list){if(x.getTotalTimeInForeground()<=0)continue;JSONObject o=new JSONObject();o.put("package",x.getPackageName());o.put("minutes",x.getTotalTimeInForeground()/60000);arr.put(o);}
                  }catch(Exception ignored){}
                  return arr.toString();
              }

              public class NotificationBridge {
                  @JavascriptInterface public void requestPermission(){runOnUiThread(() -> requestNotificationPermission());}
                  @JavascriptInterface public void sendWspeedNotification(String title,String body){runOnUiThread(() -> notifyNow(title,body));}
                  @JavascriptInterface public void sendTestNotification(){runOnUiThread(() -> notifyNow("⚔️ Daily Quest","Notification system is working. Try not to ignore it, bum."));}
                  @JavascriptInterface public void scheduleNotification(String title,String body,long delayMs){runOnUiThread(() -> scheduleNotification(title,body,delayMs));}
                  @JavascriptInterface public void openUsageSettings(){
                      try {
                          Intent intent=new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch(Exception e) {
                          try { startActivity(new Intent(Settings.ACTION_SETTINGS)); } catch(Exception ignored) {}
                      }
                  }
                  @JavascriptInterface public boolean hasUsageAccess(){return usageAccessGranted();}
                  @JavascriptInterface public String getUsageSummary(){return usageSummary();}
              }
          }
          JAVA

          cat > "$APP/java/com/dailyquest/app/AlarmReceiver.java" <<'JAVA'
          package com.dailyquest.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class AlarmReceiver extends BroadcastReceiver {
              public static final String CHANNEL_ID="daily_quest_notifications";
              @Override public void onReceive(Context context,Intent intent){
                  NotificationManager nm=(NotificationManager)context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if(Build.VERSION.SDK_INT>=26){
                      NotificationChannel c=new NotificationChannel(CHANNEL_ID,"Daily Quest",NotificationManager.IMPORTANCE_DEFAULT);
                      nm.createNotificationChannel(c);
                  }
                  android.app.Notification.Builder b=Build.VERSION.SDK_INT>=26?new android.app.Notification.Builder(context,CHANNEL_ID):new android.app.Notification.Builder(context);
                  b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(intent.getStringExtra("title")).setContentText(intent.getStringExtra("body")).setAutoCancel(true);
                  nm.notify((int)(System.currentTimeMillis()%100000),b.build());
              }
          }
          JAVA

          # The web patch below runs inside the build workspace. The quoted heredoc keeps JS template literals safe.
          ln -s "$APP" '$APP'
          python3 - <<'PY'
          from pathlib import Path
          p=Path("$APP/assets/index.html")
          text=p.read_text()

          text=text.replace(
              '<button class="ghost" onclick="toggleMenu();requestUsage()">📱 Activity awareness</button>',
              '<button id="onlineModeBtn" class="ghost" onclick="toggleOnlineMode()">🌐 Online Mode: OFF</button><button class="ghost" onclick="toggleMenu();openWSpeedProfile()">⚔ W Speed Profile</button><button class="ghost" onclick="toggleMenu();requestUsage()">📱 Activity awareness</button>'
          )
          text=text.replace(
              '<input id="qeSchedule" placeholder="Schedule e.g. Mon/Wed/Fri 7 PM"><button class="gold" onclick="createQuest()">Create quest</button>',
              '<input id="qeSchedule" placeholder="Schedule e.g. Mon/Wed/Fri 7 PM"><textarea id="qeDesc" rows="3" placeholder="Quest description — what exactly do you need to do?"></textarea><button class="gold" onclick="createQuest()">Create quest</button>'
          )
          text=text.replace(
              '<div class="qmain"><div class="qname">${esc(q.name)}</div><div class="qmeta">${esc(q.category)} • ${esc(q.schedule)} • +${q.xp||25} XP</div></div>',
              '<div class="qmain"><div class="qname">${esc(q.name)}</div><div class="qmeta">${esc(q.category)} • ${esc(q.schedule)} • +${q.xp||25} XP</div>${q.description?`<div class="note">${esc(q.description)}</div>`:""}</div>'
          )
          text=text.replace(
              "s.quests.push({id:'q_'+Date.now(),name:n,category:document.getElementById('qeCat').value,schedule:document.getElementById('qeSchedule').value.trim()||'Flexible',xp:Number(document.getElementById('qeXp').value)||50,done:false});",
              "const desc=document.getElementById('qeDesc').value.trim();if(!desc)return toast('Every quest needs a description. Tell W Speed what actually has to be done.');s.quests.push({id:'q_'+Date.now(),name:n,description:desc,category:document.getElementById('qeCat').value,schedule:document.getElementById('qeSchedule').value.trim()||'Flexible',xp:Number(document.getElementById('qeXp').value)||50,done:false});"
          )
          old="<input id=\"es\" value=\"${esc(q.schedule)}\"><div class=\"actions\"><button class=\"gold\" onclick=\"saveEdit('${id}')\">Save</button>"
          new="<input id=\"es\" value=\"${esc(q.schedule)}\"><textarea id=\"edesc\" rows=\"3\" placeholder=\"Quest description\">${esc(q.description||'')}</textarea><div class=\"actions\"><button class=\"gold\" onclick=\"saveEdit('${id}')\">Save</button>"
          text=text.replace(old,new)
          text=text.replace(
              "q.category=document.getElementById('ec').value;q.xp=Number(document.getElementById('ex').value)||50;q.schedule=document.getElementById('es').value.trim()||'Flexible';save();",
              "q.category=document.getElementById('ec').value;q.xp=Number(document.getElementById('ex').value)||50;q.schedule=document.getElementById('es').value.trim()||'Flexible';q.description=document.getElementById('edesc').value.trim();if(!q.description)return toast('A quest description is required.');save();"
          )
          text=text.replace(
              "function questContext(){return {date:today(),streak:s.streak,xp:s.xp,level:Math.floor(s.xp/500)+1,quests:s.quests.map(q=>({name:q.name,category:q.category,schedule:q.schedule,done:!!q.done,xp:q.xp})),recentCompleted:Object.keys(s.claimed).slice(-12)}}",
              "function questContext(){return {date:today(),streak:s.streak,xp:s.xp,level:Math.floor(s.xp/500)+1,quests:s.quests.map(q=>({name:q.name,description:q.description||'',category:q.category,schedule:q.schedule,done:!!q.done,xp:q.xp})),recentCompleted:Object.keys(s.claimed).slice(-12)}}"
          )
          marker="function openSettings(){openModal(`"
          profile="function openWSpeedProfile(){openModal(`<div style=\"text-align:center\"><img src=\"w_speed_icon.jpg\" style=\"width:120px;height:120px;object-fit:cover;border-radius:24px;border:1px solid #b9914d88;box-shadow:0 15px 45px #0008\"><h2 style=\"margin-bottom:4px\">W Speed</h2><div class=\"eyebrow\">THE KNIGHT OF REALITY</div><p class=\"note\">Your personal quest companion. Blunt, chaotic, protective, and genuinely on your side.</p></div><div class=\"card\" style=\"margin-top:12px\"><b>Personality</b><p class=\"note\">Modern Gen-Z speech by default, occasional medieval outrage for comedy, aggressive support, fresh jokes, and no fake answers. Truth comes before the roast.</p></div><div class=\"actions\" style=\"margin-top:12px\"><button class=\"gold\" onclick=\"closeModal()\">Back to questing</button></div>`)}\n"
          if marker in text and 'function openWSpeedProfile()' not in text:
              text=text.replace(marker,profile+marker)
          text=text.replace("let s=JSON.parse(localStorage.getItem(KEY)||'null')||{xp:0,streak:0,quests:[],days:{},claimed:{},achievements:{},saved:0,goal:4000,filter:'all'};", "let s=JSON.parse(localStorage.getItem(KEY)||'null')||{xp:0,streak:0,quests:[],days:{},claimed:{},achievements:{},saved:0,goal:4000,filter:'all',onlineMode:false};if(typeof s.onlineMode!=='boolean')s.onlineMode=false;")
          text=text.replace("function toggleMenu(){document.getElementById('menu').classList.toggle('show')}", "function toggleMenu(){document.getElementById('menu').classList.toggle('show')}\nfunction toggleOnlineMode(){s.onlineMode=!s.onlineMode;save();updateOnlineModeUI();if(s.onlineMode){toast('Online Mode enabled. W Speed is ready.')}else toast('Online Mode disabled. W Speed will stay quiet.')}\nfunction updateOnlineModeUI(){const b=document.getElementById('onlineModeBtn'),st=document.getElementById('aiStatus');if(b)b.textContent='🌐 Online Mode: '+(s.onlineMode?'ON':'OFF');if(st)st.textContent=s.onlineMode?'online mode ready':'online mode off';}")
          text=text.replace("async function sendAI(){const input=document.getElementById('chatInput'),msg=input.value.trim();if(!msg)return;", "async function sendAI(){const input=document.getElementById('chatInput'),msg=input.value.trim();if(!msg)return;if(!s.onlineMode){addMsg('ai','Online Mode is OFF. Open the menu and turn it on first, bro.');return;}")
          text=text.replace("renderQuests();renderAchievements();save();", "renderQuests();renderAchievements();updateOnlineModeUI();save();")
          text=text.replace("function save(){localStorage.setItem(KEY,JSON.stringify(s))}", "function save(){localStorage.setItem(KEY,JSON.stringify(s))}\ns.quests.forEach(q=>{if(!q.description)q.description='Complete this quest according to its schedule and category.'});")
          p.write_text(text)
          PY
          rm -f '$APP'

          MANIFEST="$APP/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          grep -q 'android.permission.PACKAGE_USAGE_STATS' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />' "$MANIFEST"
          grep -q 'AlarmReceiver' "$MANIFEST" || sed -i '/<application/a\        <receiver android:name=".AlarmReceiver" android:exported="false" />' "$MANIFEST"

      - name: Repack updated Android project ZIP
        run: |
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          rm -f Daily_Quest_PhoneBuild.zip
          cd "$PROJECT"
          zip -qr "$GITHUB_WORKSPACE/Daily_Quest_PhoneBuild.zip" .

      - name: Commit updated project ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Daily_Quest_PhoneBuild.zip
          if git diff --cached --quiet; then echo "No ZIP changes to commit."; else git commit -m "Build Daily Quest v2 Android layer"; git push; fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          cd "$PROJECT"
          gradle --no-daemon assembleDebug
      - name: Find APK
        run: find build_project -name "*.apk" -type f -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Quest-APK-v2
          path: 'build_project/**/*.apk'
