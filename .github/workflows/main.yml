name: Build Daily Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'Daily_Quest_PhoneBuild.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -o Daily_Quest_PhoneBuild.zip -d build_project
          echo "Extracted files:"
          find build_project -maxdepth 6 -type f | head -100

      - name: Apply latest Daily Quest HTML
        run: |
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          mkdir -p "$PROJECT/app/src/main/assets"
          cp Daily_Quest_Web/index.html "$PROJECT/app/src/main/assets/index.html"
          echo "Updated HTML: $PROJECT/app/src/main/assets/index.html"

      - name: Repack updated Android project ZIP
        run: |
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          rm -f Daily_Quest_PhoneBuild.zip
          cd "$PROJECT"
          zip -qr "$GITHUB_WORKSPACE/Daily_Quest_PhoneBuild.zip" .
          echo "Updated ZIP created."

      - name: Commit updated project ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Daily_Quest_PhoneBuild.zip
          if git diff --cached --quiet; then
            echo "No ZIP changes to commit."
          else
            git commit -m "Update Daily Quest Android project with latest HTML"
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          echo "Project found at: $PROJECT"
          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find build_project -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Quest-APK
          path: 'build_project/**/*.apk'
