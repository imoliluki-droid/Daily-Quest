name: Build Daily Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'Daily_Quest_PhoneBuild.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract current latest Android project
        run: |
          set -e
          rm -rf build_project
          mkdir -p build_project
          unzip -q Daily_Quest_PhoneBuild.zip -d build_project

      - name: Preserve current app and add Activity Awareness only
        shell: bash
        run: |
          set -e
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          APP="$PROJECT/app/src/main"
          HTML="$APP/assets/index.html"
          JAVA="$APP/java/com/dailyquest/app/MainActivity.java"
          MANIFEST="$APP/AndroidManifest.xml"

          test -s "$HTML"
          test -s "$JAVA"
          grep -q 'W Speed' "$HTML"
          grep -q 'AndroidNotifications' "$JAVA"

          python3 - "$HTML" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')

          if 'function requestUsageAccess()' not in text:
              marker='<button class="secondary" onclick="requestNotify()">'
              button='<button class="secondary" onclick="requestUsageAccess()">⚔️ Activity Awareness</button>'
              if marker not in text:
                  raise SystemExit('Notification button marker not found; refusing to alter the current UI.')
              text=text.replace(marker,button+marker,1)
              fn='''\nfunction requestUsageAccess(){\n  if(window.ActivityAwareness){\n    ActivityAwareness.openUsageAccessSettings();\n  }else{\n    alert("Activity Awareness is unavailable in this build.");\n  }\n}\n'''
              end='</script>'
              if end not in text:
                  raise SystemExit('Script boundary not found; refusing to alter the current UI.')
              text=text.replace(end,fn+end,1)

          p.write_text(text,encoding='utf-8')
          PY

          python3 - "$JAVA" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')

          if 'ActivityAwarenessBridge' not in text:
              if 'import android.content.Intent;' not in text:
                  text=text.replace('import android.content.pm.PackageManager;','import android.content.Intent;\n          import android.content.pm.PackageManager;')
              if 'import android.provider.Settings;' not in text:
                  text=text.replace('import android.os.Bundle;','import android.os.Bundle;\n          import android.provider.Settings;')
              anchor='w.addJavascriptInterface(new NotificationBridge(), "AndroidNotifications");'
              if anchor not in text:
                  raise SystemExit('Notification bridge anchor not found; refusing to replace MainActivity.')
              text=text.replace(anchor,anchor+'\n                  w.addJavascriptInterface(new ActivityAwarenessBridge(), "ActivityAwareness");',1)
              bridge='''\n\n              public class ActivityAwarenessBridge {\n                  @JavascriptInterface\n                  public void openUsageAccessSettings() {\n                      runOnUiThread(() -> startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)));\n                  }\n              }\n'''
              idx=text.rfind('\n}')
              if idx < 0:
                  raise SystemExit('MainActivity closing brace not found; refusing to alter Java.')
              text=text[:idx]+bridge+text[idx:]

          p.write_text(text,encoding='utf-8')
          PY

          if ! grep -q 'android.permission.PACKAGE_USAGE_STATS' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />' "$MANIFEST"
          fi
          if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
            sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
          fi

          grep -q 'ActivityAwareness' "$HTML"
          grep -q 'ActivityAwarenessBridge' "$JAVA"
          grep -q 'ACTION_USAGE_ACCESS_SETTINGS' "$JAVA"
          ! grep -q 'openUsageSettings(){openUsageSettings()' "$HTML"
          echo "Verified: current latest project preserved; Activity Awareness added without restoring an older base."

      - name: Repack updated Android project ZIP
        run: |
          set -e
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          rm -f Daily_Quest_PhoneBuild.zip
          cd "$PROJECT"
          zip -qr "$GITHUB_WORKSPACE/Daily_Quest_PhoneBuild.zip" .

      - name: Commit updated project ZIP
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Daily_Quest_PhoneBuild.zip
          if git diff --cached --quiet; then
            echo "No ZIP changes to commit."
          else
            git commit -m "Add Activity Awareness to latest Daily Quest build"
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          set -e
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: find build_project -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Quest-APK-v2
          path: 'build_project/**/*.apk'
          if-no-files-found: error
