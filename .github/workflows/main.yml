name: Build Daily Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'Daily_Quest_PhoneBuild.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest Android project
        run: |
          set -euo pipefail
          rm -rf build_project
          mkdir -p build_project
          unzip -q Daily_Quest_PhoneBuild.zip -d build_project

      - name: Patch latest Android project
        run: |
          set -euo pipefail
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          python3 scripts/patch_latest_android.py "$PROJECT"

      - name: Verify Activity Awareness and W Speed source
        run: |
          set -euo pipefail
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          APP="$PROJECT/app/src/main"
          grep -q 'id="onlineModeBtn"' "$APP/assets/index.html"
          grep -q 'W Speed Profile' "$APP/assets/index.html"
          grep -q 'ActivityAwareness' "$APP/assets/index.html"
          grep -q 'ActivityAwareness' "$APP/java/com/dailyquest/app/MainActivity.java"
          grep -q 'ACTION_USAGE_ACCESS_SETTINGS' "$APP/java/com/dailyquest/app/MainActivity.java"
          ! grep -q 'runOnUiThread(() -> startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)))' "$APP/java/com/dailyquest/app/MainActivity.java"
          ! grep -q 'Every quest needs a description' "$APP/assets/index.html"
          ! grep -q 'A quest description is required' "$APP/assets/index.html"
          echo 'Source verification passed.'

      - name: Repack updated Android project ZIP
        run: |
          set -euo pipefail
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          rm -f Daily_Quest_PhoneBuild.zip
          cd "$PROJECT"
          zip -qr "$GITHUB_WORKSPACE/Daily_Quest_PhoneBuild.zip" .

      - name: Commit updated Android project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Daily_Quest_PhoneBuild.zip
          if git diff --cached --quiet; then
            echo 'No source ZIP changes.'
          else
            git commit -m "Implement Daily Quest v2 fixes"
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          set -euo pipefail
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s "$(find build_project -name '*.apk' -type f | head -1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Quest-APK-v3
          path: 'build_project/**/*.apk'
          if-no-files-found: error
