- name: Find project folder
  run: |
    echo "Folders:"
    find . -maxdepth 3 -type f -name "build.gradle" -o -name "settings.gradle"

- name: Build APK
  run: |
    PROJECT=$(dirname "$(find . -name settings.gradle -type f | head -1)")
    echo "Project found at: $PROJECT"
    cd "$PROJECT"
    gradle --no-daemon assembleDebug

- name: Find APK
  run: |
    find . -name "*.apk" -type f -print

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: Daily-Quest-APK
    path: '**/*.apk'
