name: Build Daily Quest v2 Safely

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract current Android project
        run: |
          set -e
          rm -rf build_project
          mkdir -p build_project
          unzip -q Daily_Quest_PhoneBuild.zip -d build_project
      - name: Verify current project before build
        run: |
          set -e
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          APP="$PROJECT/app/src/main"
          test -s "$APP/assets/index.html"
          test -s "$APP/java/com/dailyquest/app/MainActivity.java"
          grep -q 'W Speed' "$APP/assets/index.html"
          grep -q 'android.permission.INTERNET' "$APP/AndroidManifest.xml"
          echo "Using the current repository ZIP; no older commit is restored."
      - name: Build v2 APK
        run: |
          set -e
          PROJECT=$(dirname "$(find build_project -name settings.gradle -type f | head -1)")
          cd "$PROJECT"
          gradle --no-daemon assembleDebug
      - name: Upload v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Quest-APK-v2
          path: 'build_project/**/*.apk'
          if-no-files-found: error
