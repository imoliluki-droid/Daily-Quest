name: Migrate W Speed client to Render

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch W Speed client endpoint
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Daily_Quest_Web/index.html')
          text = p.read_text(encoding='utf-8')
          render_url = 'https://daily-quest-wspeed.onrender.com/api/wspeed/chat'
          if render_url in text:
              print('W Speed Render endpoint is already configured.')
              raise SystemExit(0)

          old = "function sendAI(){const input=document.getElementById('chatInput'),text=input.value.trim();if(!text)return;const log=document.getElementById('chatLog'),user=document.createElement('div');user.className='chat-user';user.innerHTML='<b>You:</b> '+escapeHTML(text);log.appendChild(user);const ai=document.createElement('div');ai.className='chat-ai';if(!onlineMode||!navigator.onLine){ai.innerHTML='<b>W Speed:</b> You are currently offline. Your quests, timers, XP, and progress still work normally.'}else{ai.innerHTML='<b>W Speed:</b> Online Mode is active, but my secure AI connection has not been connected yet. That will be added in the next stage.'}log.appendChild(ai);log.scrollTop=log.scrollHeight;input.value=''}"
          new = """async function sendAI(){const input=document.getElementById('chatInput'),text=input.value.trim();if(!text)return;const log=document.getElementById('chatLog'),user=document.createElement('div');user.className='chat-user';user.innerHTML='<b>You:</b> '+escapeHTML(text);log.appendChild(user);const ai=document.createElement('div');ai.className='chat-ai';log.appendChild(ai);log.scrollTop=log.scrollHeight;input.value='';if(!onlineMode||!navigator.onLine){ai.innerHTML='<b>W Speed:</b> You are currently offline. Your quests, timers, XP, and progress still work normally.';return}ai.innerHTML='<b>W Speed:</b> Thinking...';try{const response=await fetch('https://daily-quest-wspeed.onrender.com/api/wspeed/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,context:{questProgress:s.quests,streak:s.streak,xp:s.xp,pcFund:{goal:s.goal,saved:s.saved}}})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.reply)throw new Error(data.error||'W Speed request failed');ai.innerHTML='<b>W Speed:</b> '+escapeHTML(data.reply)}catch(e){console.error('W Speed error:',e);ai.innerHTML='<b>W Speed:</b> My connection to the realm failed for a moment. Try again.'}log.scrollTop=log.scrollHeight}"""
          if old not in text:
              raise SystemExit('Expected sendAI function was not found; stopping without changes.')
          text = text.replace(old, new, 1)
          text = text.replace('AI service connection will be added through a secure backend. Your API key will never be stored directly inside the APK.','W Speed is connected through the secure Render backend. Your API key is never stored inside the APK.')
          text = text.replace('The secure AI backend will be added later. No API key will be stored inside the APK.','W Speed uses the secure Render backend. No API key is stored inside the APK.')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Daily_Quest_Web/index.html
          if git diff --cached --quiet; then
            echo "No migration changes needed."
          else
            git commit -m "Connect W Speed to Render backend"
            git push
          fi
